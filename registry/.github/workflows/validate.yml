# Validates every pull request that touches index.json and merges it
# automatically when all self-service publishing rules pass.
#
# One-time repo setup (see README.md):
#   1. Settings -> General -> Pull Requests: enable "Allow auto-merge"
#   2. Settings -> Actions -> General -> Workflow permissions: "Read and write"
#   3. Create the label "validation-failed" (or let step 'Report failures' fail silently)
#   4. Branch protection on main: require status check "Validate registry changes",
#      do NOT require human approvals.

name: Validate registry changes

on:
  pull_request:
    paths:
      - "index.json"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate index.json changes
        id: validate
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python scripts/validate_index.py \
            --base "$BASE_SHA" \
            --head HEAD \
            --pr-author "$PR_AUTHOR" \
            --report validation_report.md

      - name: Approve and enable auto-merge
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr review "$PR_NUMBER" --approve || true
          gh pr merge "$PR_NUMBER" --auto --squash

      - name: Report failures
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body-file validation_report.md || true
          gh pr edit "$PR_NUMBER" --add-label "validation-failed" || true

      - name: Post success summary
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --body "✅ Validation passed — merging automatically. Your package is now live in the registry. Thanks for publishing!" \
            || true
