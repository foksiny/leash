# Validates every pull request that touches index.json against the
# self-service publishing rules. On success, a companion workflow
# (merge.yml, triggered via workflow_run) merges the PR automatically.
#
# One-time repo setup (see README.md):
#   1. Settings -> Actions -> General -> Workflow permissions: "Read and write"
#      and "Allow GitHub Actions to create and approve pull requests"
#   2. Branch protection on main: require status check "Validate registry changes",
#      do NOT require human approvals. (Auto-merge is not used; the merge
#      workflow merges directly once this check passes.)

name: Validate registry changes

on:
  pull_request:
    paths:
      - "index.json"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate registry changes
    runs-on: ubuntu-latest
    steps:
      # Check out the trusted base ref: never execute validator code from
      # the PR under review. The PR head is fetched read-only as a ref and
      # used only as the diff target.
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch PR head as a read-only ref
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch origin "pull/$PR_NUMBER/head:refs/remotes/origin/pr-head"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate index.json changes
        id: validate
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python scripts/validate_index.py \
            --base "$BASE_SHA" \
            --head refs/remotes/origin/pr-head \
            --pr-author "$PR_AUTHOR" \
            --report validation_report.md

      - name: Report failures
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REPO="${{ github.repository }}"
          gh pr comment "$PR_NUMBER" -R "$REPO" --body-file validation_report.md || true
          gh pr edit "$PR_NUMBER" -R "$REPO" --add-label "validation-failed" || true
